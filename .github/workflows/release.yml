name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag/version guard
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Syntax and tests
        run: |
          zsh -n scripts/*.sh Tests/*.sh
          python3 -m py_compile Integrations/phosignal-hook.py scripts/configure-hooks.py
          chmod +x Tests/*.sh scripts/*.sh
          ./Tests/run-profile-store-tests.sh
          ./Tests/run-hook-config-tests.sh
          ./Tests/run-hook-behaviour-tests.sh
      - name: Build signed release archive
        run: ./scripts/build.sh
      - name: Verify release archive
        run: |
          VERIFY="$(mktemp -d /tmp/phosignal-release.XXXXXX)"
          ditto -x -k ".build/release/PhoSignal-$(cat VERSION).zip" "$VERIFY"
          codesign --verify --deep --strict "$VERIFY/PhoSignal.app"
          shasum -a 256 ".build/release/PhoSignal-$(cat VERSION).zip" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            .build/release/PhoSignal-*.zip
            SHA256SUMS
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PhoSignal-*.zip SHA256SUMS             --repo "$GITHUB_REPOSITORY"             --verify-tag             --generate-notes             --title "PhoSignal $GITHUB_REF_NAME"
